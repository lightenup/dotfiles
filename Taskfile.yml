version: '3'

tasks:
  install:
    desc: Run full dotfiles installation
    cmds:
      - ./install.sh

  status:
    desc: Show overall dotfiles status
    cmds:
      - task brew:check
      - task symlinks:check
      - git -C . status --short

  brew:check:
    desc: Verify machine matches Brewfile
    cmds:
      - brew bundle check --file=./Brewfile --no-upgrade

  brew:install:
    desc: Install/update Homebrew packages from Brewfile
    cmds:
      - brew bundle install --file=./Brewfile --no-upgrade

  brew:reconcile:
    desc: Show installed entries missing from Brewfile
    cmds:
      - ./scripts/brew-reconcile.sh || [ $? -eq 2 ]

  brew:dump:
    desc: Replace Brewfile with full machine snapshot
    cmds:
      - brew bundle dump --file=./Brewfile --force

  symlinks:check:
    desc: Verify linked dotfiles symlinks
    cmds:
      - ./scripts/symlinks-check.sh

  skills:install:
    desc: Install or refresh upstream agent skills from skills.yml
    cmds:
      - ./scripts/skills-install.sh

  skills:status:
    desc: Show local agent skills and whether each entry is symlinked
    cmds:
      - ./scripts/skills-status.sh

  skills:test:
    desc: Run tests for skill libraries and helpers
    cmds:
      # via uv: no pytest in the Homebrew python, and no reason to install one
      - uv run --with pytest -- pytest skills/ -v {{.CLI_ARGS}}

  mcp:install:
    desc: Distribute MCP servers from mcp/servers.json into all AI clients
    cmds:
      - ./scripts/mcp-install.sh install

  mcp:status:
    desc: Show MCP servers configured per AI client
    cmds:
      - ./scripts/mcp-install.sh status

  ocr:provision-tessdata:
    desc: Download tessdata for Tesseract OCR fallback (en, sv, no, da)
    cmds:
      - mkdir -p ~/.local/share/tessdata
      - |
        # Download to a temp file and size-check before moving into place: a
        # proxy error page would otherwise be cached forever as a valid file.
        set -e
        dir="$HOME/.local/share/tessdata"
        base="https://github.com/tesseract-ocr/tessdata_best/raw/main"
        min_bytes=5000000
        rc=0
        for lang in eng swe nor dan; do
          target="$dir/${lang}.traineddata"
          size=0
          [ -f "$target" ] && size="$(wc -c < "$target")"
          if [ "$size" -ge "$min_bytes" ]; then
            echo "${lang}.traineddata already present"
            continue
          fi
          echo "Downloading ${lang}.traineddata..."
          tmp="$(mktemp)"
          if wget -q -O "$tmp" "$base/${lang}.traineddata" \
             && [ "$(wc -c < "$tmp")" -ge "$min_bytes" ]; then
            mv "$tmp" "$target"
          else
            rm -f "$tmp"
            echo "FAILED: ${lang}.traineddata (blocked or truncated)" >&2
            rc=1
          fi
        done
        exit $rc

  certs:zscaler:
    desc: Re-export the corporate root CA for node-based tools
    cmds:
      - mkdir -p ~/.config/certs
      - |
        set -e
        out="$HOME/.config/certs/zscaler.pem"
        keychain=/Library/Keychains/System.keychain
        security find-certificate -a -p -c "Zscaler" "$keychain" > "$out"
        if [ ! -s "$out" ]; then
          rm -f "$out"
          echo "No corporate root CA found in the System keychain" >&2
          exit 1
        fi
        count="$(grep -c 'BEGIN CERTIFICATE' "$out")"
        echo "Exported $count certificate(s) to $out"

  mise:install:
    desc: Install mise-managed toolchains (dotnet, java) from global config
    cmds:
      - mise install
      - mise ls

  vscode:extensions:
    desc: Install Brewfile-declared VS Code extensions (brew bundle cannot)
    cmds:
      - ./scripts/vscode-extensions.sh

  ocr:server:
    desc: Manage the EasyOCR Docker server (start|stop|status)
    cmds:
      - ./scripts/ocr-server.sh {{.CLI_ARGS}}
