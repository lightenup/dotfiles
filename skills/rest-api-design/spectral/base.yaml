# base.yaml — profile-independent rules for the rest-api-design skill.
#
# Everything here is a defect under any reasonable convention. Nothing here depends on
# a style choice: no casing, no versioning scheme, no error model. Those live in the
# rules generated by profile-overlay.mjs from your api-style.yaml.
#
# Severity is triage, not a gate:
#
#   error  the contract is unusable, or there is a security exposure
#   warn   a real design defect with a clear fix
#   info   a deviation from a decision this API has recorded
#   hint   advisory — worth a look, may be justified
#
# `lint-api.sh` reports and exits 0 by default. Pass --gate to fail on errors.
#
# Run standalone:
#   npx @stoplight/spectral-cli lint --ruleset spectral/base.yaml openapi/my-api.yaml

extends:
  - [spectral:oas, recommended]

functionsDir: "./functions"

# Only the functions this ruleset actually uses. The profile-derived ruleset declares
# its own — Spectral resolves `functionsDir` relative to the file that declares it and
# does not inherit function declarations across `extends`.
functions:
  - schemaDefects
  - responseDefects
  - operationDefects
  - orphanComponents
  - pathDefects
  - proseConstraints
  - paginationDefects
  - structuralSmells

rules:

  # ── Contract exists and is well formed ─────────────────────────────────────

  rad-schema-defects:
    description: >-
      Schema declarations that no code generator can use: placeholder types, enums
      holding examples, arrays without items, objects without properties.
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: false
    then:
      function: schemaDefects

  rad-response-contract:
    description: >-
      Operations must declare what they return, including how they fail. An operation
      whose response shape lives only in the implementation has no contract to reason
      about and nothing that detects drift.
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: false
    then:
      function: responseDefects
      functionOptions:
        checks: ["successContent", "errorDeclared", "descriptions", "locationHeader"]

  rad-response-required:
    description: >-
      Response schemas should declare which properties the server always returns.
      Checked on the resolved document, because the guarantee belongs to the schema a
      client actually receives, not to the $ref that points at it.
    message: "{{error}}"
    severity: warn
    given: "$"
    resolved: true
    then:
      function: responseDefects
      functionOptions:
        checks: ["requiredProperties"]

  rad-operation-identity:
    description: >-
      operationIds must exist and be unique; summaries and descriptions must not
      contradict each other.
    message: "{{error}}"
    severity: warn
    given: "$"
    resolved: false
    then:
      function: operationDefects

  rad-orphan-components:
    description: >-
      Components defined but never referenced. Usually a stale approximation of a shape
      that has since diverged, and readers assume it is authoritative.
    message: "{{error}}"
    severity: warn
    given: "$"
    resolved: false
    then:
      function: orphanComponents

  rad-path-hygiene:
    description: >-
      Whitespace in paths, duplicate paths differing only by a trailing slash,
      unbalanced templating braces.
    message: "{{error}}"
    severity: error
    given: "$"
    resolved: false
    then:
      function: pathDefects

  # ── Cross-cutting defects that hold under any style ────────────────────────

  rad-unbounded-collection:
    description: >-
      Collection endpoints must offer a way to bound the result set. Any recognisable
      pagination parameter satisfies this rule; the style profile decides which one you
      should be using.
    message: "{{error}}"
    severity: warn
    given: "$"
    resolved: true
    then:
      function: paginationDefects

  rad-prose-constraints:
    description: >-
      Constraints stated in a description but absent from the schema. Heuristic — it
      will occasionally fire on a description that merely mentions a format.
    message: "{{error}}"
    severity: hint
    given: "$"
    resolved: false
    then:
      function: proseConstraints

  # ── Decomposition smells ───────────────────────────────────────────────────
  # These do not prove anything. They point the procedure in
  # references/09-decomposition.md at the representations worth analysing.

  rad-decomposition-smell:
    description: >-
      A response representation that is unusually deep, unusually broad, or unusually
      nullable. Each is a signal that one endpoint is serving several resources or
      several personas.
    message: "{{error}}"
    severity: hint
    given: "$"
    resolved: true
    then:
      function: structuralSmells
      functionOptions:
        maxDepth: 3
        maxProperties: 40
        maxNullableRatio: 0.6

  # ── Adjustments to spectral:oas defaults ───────────────────────────────────
  # The stock ruleset treats some of these as style; in an estate that has lost its
  # contracts they are the difference between a usable document and a decorative one.
  #
  # `oas3-schema` is deliberately left on even though it overlaps rad-schema-defects on
  # invalid type names. It validates far more of the document structure than we do, and
  # our message adds the remedy rather than repeating the diagnosis.

  operation-tags: off            # tags are organisational; not worth noise here
  info-contact: off              # rarely maintained, never load-bearing
  oas3-unused-component: off     # superseded by rad-orphan-components, which explains why
  array-items: off               # fully subsumed by rad-schema-defects
